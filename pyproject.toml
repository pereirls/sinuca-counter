[project]
name = "sinuca-counter"
version = "0.1.0"
description = "Automatic score counter for Brazilian sinuca, snooker and English pool. MVP works on recorded MP4 files; designed to extend to live streams and YOLO-based detection."
authors = [
    { name = "Lucas Pereira", email = "lucas_sp100@hotmail.com" },
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.1.0",
    "supervision>=0.18.0",
]

[project.scripts]
sinuca-counter = "sinuca_counter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sinuca_counter"]

[tool.hatch.build.targets.wheel.force-include]
"src/sinuca_counter/overlay/static" = "sinuca_counter/overlay/static"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
