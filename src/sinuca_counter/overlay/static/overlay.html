<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Sinuca Counter — Overlay</title>
    <link rel="stylesheet" href="/static/overlay.css" />
  </head>
  <body data-theme="transparent">
    <div class="overlay" id="overlay">
      <div class="player" id="player-p1">
        <div class="turn-dot" aria-hidden="true"></div>
        <div class="name">P1</div>
        <div class="score">0</div>
      </div>
      <div class="separator">×</div>
      <div class="player" id="player-p2">
        <div class="turn-dot" aria-hidden="true"></div>
        <div class="name">P2</div>
        <div class="score">0</div>
      </div>
      <div class="status" id="status"></div>
    </div>
    <script src="/static/overlay.js"></script>
  </body>
</html>
