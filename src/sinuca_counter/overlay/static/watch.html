<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Sinuca Counter — Watch</title>
    <link rel="stylesheet" href="/static/watch.css" />
  </head>
  <body>
    <div class="stage">
      <img id="video" class="video" src="/stream.mjpg" alt="live video" />
      <div class="scoreboard" id="scoreboard">
        <div class="player" id="player-p1">
          <div class="turn-dot" aria-hidden="true"></div>
          <div class="name">P1</div>
          <div class="score">0</div>
        </div>
        <div class="separator">×</div>
        <div class="player" id="player-p2">
          <div class="turn-dot" aria-hidden="true"></div>
          <div class="name">P2</div>
          <div class="score">0</div>
        </div>
      </div>
      <div class="target" id="target"></div>
      <div class="status" id="status"></div>
    </div>
    <script src="/static/watch.js"></script>
  </body>
</html>
